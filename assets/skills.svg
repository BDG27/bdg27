<svg width="560" height="300" viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Uso no dia a dia: Backend, Banco de dados, Arquitetura de sistemas, Frontend, DevOps e cloud" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="560" height="300" rx="12" fill="#0F1A2B"/>

  <!-- Backend -->
  <text x="24" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#EDEEF0">Backend</text>
  <rect x="190" y="38" width="330" height="14" rx="7" fill="#1D2B3F"/>
  <rect x="190" y="38" width="0" height="14" rx="7" fill="#E8A33D">
    <animate attributeName="width" from="0" to="297" dur="1.1s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/>
  </rect>
  <text x="528" y="50" text-anchor="end" font-family="SFMono-Regular, Consolas, monospace" font-size="13" fill="#7E90A6" opacity="0">90%
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- Banco de dados -->
  <text x="24" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#EDEEF0">Banco de dados</text>
  <rect x="190" y="93" width="330" height="14" rx="7" fill="#1D2B3F"/>
  <rect x="190" y="93" width="0" height="14" rx="7" fill="#3FA7A3">
    <animate attributeName="width" from="0" to="281" dur="1.1s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/>
  </rect>
  <text x="528" y="105" text-anchor="end" font-family="SFMono-Regular, Consolas, monospace" font-size="13" fill="#7E90A6" opacity="0">85%
    <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- Arquitetura de sistemas -->
  <text x="24" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#EDEEF0">Arquitetura de sistemas</text>
  <rect x="190" y="148" width="330" height="14" rx="7" fill="#1D2B3F"/>
  <rect x="190" y="148" width="0" height="14" rx="7" fill="#E8A33D">
    <animate attributeName="width" from="0" to="281" dur="1.1s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/>
  </rect>
  <text x="528" y="160" text-anchor="end" font-family="SFMono-Regular, Consolas, monospace" font-size="13" fill="#7E90A6" opacity="0">85%
    <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- Frontend -->
  <text x="24" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#EDEEF0">Frontend</text>
  <rect x="190" y="203" width="330" height="14" rx="7" fill="#1D2B3F"/>
  <rect x="190" y="203" width="0" height="14" rx="7" fill="#3FA7A3">
    <animate attributeName="width" from="0" to="257" dur="1.1s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/>
  </rect>
  <text x="528" y="215" text-anchor="end" font-family="SFMono-Regular, Consolas, monospace" font-size="13" fill="#7E90A6" opacity="0">78%
    <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.3s" fill="freeze"/>
  </text>

  <!-- DevOps e cloud -->
  <text x="24" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#EDEEF0">DevOps e cloud</text>
  <rect x="190" y="258" width="330" height="14" rx="7" fill="#1D2B3F"/>
  <rect x="190" y="258" width="0" height="14" rx="7" fill="#E8A33D">
    <animate attributeName="width" from="0" to="247" dur="1.1s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/>
  </rect>
  <text x="528" y="270" text-anchor="end" font-family="SFMono-Regular, Consolas, monospace" font-size="13" fill="#7E90A6" opacity="0">75%
    <animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.3s" fill="freeze"/>
  </text>
</svg>
