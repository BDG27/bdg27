<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bruno Demarchi — desenvolvedor full stack para sistemas de varejo e indústria" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Bruno Demarchi — desenvolvedor full stack</title>

  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#17263c"/>
    </pattern>
  </defs>

  <style>
    .hero { opacity: 0; animation: fadein 1s ease-out forwards; animation-delay: .15s; }
    @keyframes fadein { to { opacity: 1; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="1200" height="320" fill="#0F1A2B"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <rect x="0" y="0" width="6" height="320" fill="#E8A33D"/>

  <!-- painel traseiro (dashboard motif) -->
  <rect x="830" y="95" width="290" height="165" rx="12" fill="#101c2e" stroke="#1D2B3F" stroke-width="2" opacity="0.7"/>
  <!-- painel frontal -->
  <rect x="760" y="55" width="300" height="170" rx="12" fill="#0c1726" stroke="#27374F" stroke-width="2"/>
  <circle cx="782" cy="76" r="4" fill="#E8A33D"/>
  <circle cx="798" cy="76" r="4" fill="#3FA7A3"/>
  <circle cx="814" cy="76" r="4" fill="#27374F"/>
  <rect x="782" y="96" width="130" height="8" rx="4" fill="#1D2B3F"/>
  <rect x="782" y="112" width="190" height="8" rx="4" fill="#1D2B3F"/>
  <rect x="782" y="128" width="100" height="8" rx="4" fill="#1D2B3F"/>
  <!-- mini gráfico de barras -->
  <rect x="930" y="170" width="14" height="30" fill="#E8A33D" opacity="0.85"/>
  <rect x="950" y="155" width="14" height="45" fill="#3FA7A3" opacity="0.85"/>
  <rect x="970" y="180" width="14" height="20" fill="#E8A33D" opacity="0.85"/>
  <rect x="990" y="145" width="14" height="55" fill="#3FA7A3" opacity="0.85"/>
  <rect x="1010" y="165" width="14" height="35" fill="#E8A33D" opacity="0.85"/>

  <g class="hero">
    <text x="64" y="132" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-weight="700" font-size="50" fill="#EDEEF0"><tspan fill="#E8A33D">&gt;</tspan> Bruno Demarchi</text>
    <rect class="cursor" x="550" y="94" width="14" height="46" fill="#3FA7A3"/>

    <text x="64" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#9FB0C3">Desenvolvedor full stack construindo sistemas</text>
    <text x="64" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" fill="#9FB0C3">para varejo e indústria há mais de 10 anos.</text>

    <line x1="64" y1="215" x2="470" y2="215" stroke="#27374F" stroke-width="2"/>

    <text x="64" y="250" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-weight="700" font-size="24" fill="#E8A33D">10+</text>
    <text x="64" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#7E90A6">anos de experiência</text>

    <rect x="150" y="232" width="1" height="48" fill="#27374F"/>

    <text x="170" y="250" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-weight="700" font-size="24" fill="#E8A33D">480</text>
    <text x="170" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#7E90A6">commits em 2025</text>

    <rect x="310" y="232" width="1" height="48" fill="#27374F"/>

    <text x="330" y="250" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-weight="700" font-size="24" fill="#E8A33D">883</text>
    <text x="330" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#7E90A6">commits em 2026</text>
  </g>
</svg>
